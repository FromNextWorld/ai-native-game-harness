- id: tool-pwsh
  disabled: false

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

- id: llm-pi-ai
  config:
    providers:
      minimax:
        displayName: MiniMax
        apiKeyEnv: GAME_MINIMAX_API_KEY
        api: openai-completions
        baseURL: https://api.minimax.cn/v1
        defaultMaxTokens: 8192
        models:
          - id: MiniMax-M3
            name: MiniMax-M3
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              max: max
            compat:
              supportsReasoningEffort: true
              thinkingFormat: zai

- id: agent-default-model
  config:
    provider: minimax
    model: MiniMax-M3
    reasoningEffort: off

- id: work-orchestrator
  config:
    enabled: true
    provider: minimax
    model: MiniMax-M3
    reasoningEffort: max

- id: xiaotangyuan-game
  config:
    port: 33145
    vision:
      enabled: true
      provider: minimax
      model: MiniMax-M3
      reasoningEffort: off
      strictModel: true
      maxWidth: 768
    speech:
      enabled: true
      provider: auto
      credentialRef: VOLCENGINE_API_KEY
      ttsResourceId: seed-tts-2.0
      ttsVoice: ICL_uranus_zh_female_yuanqitianmei_tob
    media:
      enabled: true
      pushToTalkVirtualKey: 86
